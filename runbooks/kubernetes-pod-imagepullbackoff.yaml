id: kubernetes.pod.imagepullbackoff
title: Pod in ImagePullBackOff
description: Diagnose a pod that cannot pull its container image.

symptoms:
  - id: kubernetes.pod.image_pull
    name: ImagePullBackOff
    keywords:
      - image
      - pull
      - registry

steps:
  - title: Describe pod
    description: Inspect pod events for image pull failures.
    command: kubectl describe pod